<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Motion boot: when JS runs and motion is allowed, mark <html> before first
      paint so animated visuals start in their pre-intro state and grow in once
      the app mounts (no flash of the finished visual first). If the app never
      starts, the mark is removed and every visual shows complete.
    -->
    <script>
      (function () {
        try {
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
          var root = document.documentElement
          root.setAttribute('data-motion', '')
          setTimeout(function () {
            if (!window.__psMotion) root.removeAttribute('data-motion')
          }, 5000)
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking web fonts: render with system fonts first, swap when loaded. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@300;400;500&amp;display=swap" />
